[package]
name = "chesslayer-web"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chesslayer = { path = "../chesslayer" }
wasm-bindgen = "0.2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
